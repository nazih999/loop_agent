name: Autonomous AI Agent Loop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-ai-loop:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install requests

      - name: Install Ollama (Local AI runner)
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama Server
        run: ollama serve &
        
      - name: Wait for Ollama to boot up
        run: sleep 5

      - name: Pull AI Models
        run: |
          ollama pull llama3.1
          ollama pull qwen2.5-coder:7b

      - name: Run Autonomous Loop
        run: python -u main.py "$(cat FloatBoard_Prompt.txt)"
        
      - name: Upload Results (Logs & Report)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-agent-results
          path: |
            generated_app/
            log_*.json
            log_*.txt
            final_report.txt
